<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Manager</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="auth-view" class="view">
  <div class="card">
    <h1>Task Manager</h1>
    <div class="tabs">
      <button id="tab-login" class="tab active">Login</button>
      <button id="tab-register" class="tab">Register</button>
    </div>

    <form id="login-form" class="form">
      <label>Email</label>
      <input type="email" id="login-email" required autocomplete="email" />
      <label>Password</label>
      <input type="password" id="login-password" required autocomplete="current-password" />
      <button type="submit">Login</button>
    </form>

    <form id="register-form" class="form hidden">
      <label>Email</label>
      <input type="email" id="register-email" required autocomplete="email" />
      <label>Password</label>
      <input type="password" id="register-password" required minlength="6" autocomplete="new-password" />
      <button type="submit">Register</button>
    </form>

    <p id="auth-error" class="error hidden"></p>
  </div>
</div>

<div id="app-view" class="view hidden">
  <header class="topbar">
    <h1>Task Manager</h1>
    <div class="topbar-right">
      <span id="user-email"></span>
      <button id="logout-btn" class="secondary">Logout</button>
    </div>
  </header>

  <main>
    <form id="task-form" class="card task-form">
      <input type="hidden" id="task-id" />
      <input type="text" id="task-title" placeholder="Title" required maxlength="255" />
      <input type="text" id="task-description" placeholder="Description (optional)" />
      <select id="task-status">
        <option value="pending">Pending</option>
        <option value="in_progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>
      <button type="submit" id="task-submit-btn">Add Task</button>
      <button type="button" id="task-cancel-btn" class="secondary hidden">Cancel</button>
    </form>

    <p id="task-error" class="error hidden"></p>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="in_progress">In Progress</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-state" class="empty hidden">No tasks yet. Add one above.</p>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
